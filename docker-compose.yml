services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eko_space_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/eko_space?sslmode=disable
      - DIRECT_URL=postgresql://postgres:postgres@db:5432/eko_space?sslmode=disable
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://localhost:3000}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-your_super_secret_better_auth_key_min_32_chars}
      - CLOUDINARY_URL=${CLOUDINARY_URL:-}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: eko_space_db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=eko_space
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eko_space"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
